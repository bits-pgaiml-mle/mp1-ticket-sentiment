project:
  name: mp1-ticket-sentiment
  flavor: C
  course: PCAM ZC412
  target: label
  classes:
    - negative
    - neutral
    - positive

data:
  raw_path: data/raw/tickets.csv
  feature_store: feature_store/feature_store.db
  feature_table: ticket_features
  feature_schema: model_store/feature_columns.json
  sample_size: 1500
  random_seed: 42

features:
  max_features: 3000
  ngram_range: [1, 2]
  min_df: 2

training:
  test_size: 0.2
  mlflow_experiment: ticket_sentiment_prediction
  model_path: model_store/sentiment_model.joblib
  vectorizer_path: model_store/tfidf_vectorizer.joblib
  label_encoder_path: model_store/label_encoder.joblib

serving:
  host: 0.0.0.0
  port: 8000
  model_version: ticket-sentiment-v1

monitoring:
  # sqlite | jsonl | both  (override with env PREDICTION_LOG_BACKEND)
  log_backend: both
  # auto | sqlite | jsonl — which log drift reads when both exist
  drift_read_backend: auto
  predictions_db: monitoring/predictions.db
  predictions_jsonl: monitoring/predictions.jsonl
  drift_shift_threshold: 0.8
  psi_alert: 0.25
